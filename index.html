function getDaysUntilTargetDay(targetDay, refDate) {
    const y = refDate.getFullYear();
    const m = refDate.getMonth();
    const d = refDate.getDate();

    const currentMidnight = new Date(y, m, d);
    let targetDate = new Date(y, m, targetDay);

    if (targetDate < currentMidnight) {
        // Target is in the next month
        targetDate = new Date(y, m + 1, targetDay);
    }

    const diffMs = targetDate.getTime() - currentMidnight.getTime();
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
}

    renderPriorityBanners(selectedDate);
    renderCardsFeed(selectedDate);
}

function renderPriorityBanners(refDate) {
    // 1. Due Soon (Next 7 days & current spend > 0)
    const dueSoon = cards
        .map(c => ({ ...c, days: getDaysUntilTargetDay(c.dueDay, refDate) }))
        .filter(c => c.current > 0 && c.days <= 7)
        .sort((a, b) => a.days - b.days);

    const dueBox = document.getElementById('dueFeed');
    if (!dueSoon.length) {
        dueBox.innerHTML = '<div style="font-size:0.75rem; color:var(--text-sub); padding:4px 0;">🎉 No pending payments in the next 7 days.</div>';
    } else {
        dueBox.innerHTML = dueSoon.map(c => `
            <div class="priority-item">
                <div>
                    <div class="p-main">${c.name}</div>
                    <div class="p-sub">Due: <strong>${c.dueDay}th</strong> | Pay: <strong style="color:var(--danger)">₹${c.current.toLocaleString('en-IN')}</strong></div>
                </div>
                <span class="badge b-danger">${c.days === 0 ? 'DUE TODAY' : (c.days === 1 ? '1d left (Tomorrow)' : c.days + 'd left')}</span>
            </div>
        `).join('');
    }

    // 2. Best Swipe (Accurate Calendar Grace Period for all cards)
    const bestSwipe = cards
        .map(c => {
            const daysToBill = getDaysUntilTargetDay(c.billDay, refDate);
            
            // Calculate days from next bill to next due date
            const y = refDate.getFullYear();
            const m = refDate.getMonth();
            let nextBillDate = new Date(y, m, c.billDay);
            if (nextBillDate < refDate) nextBillDate = new Date(y, m + 1, c.billDay);
            
            let nextDueDate = new Date(nextBillDate.getFullYear(), nextBillDate.getMonth(), c.dueDay);
            if (nextDueDate <= nextBillDate) {
                nextDueDate = new Date(nextBillDate.getFullYear(), nextBillDate.getMonth() + 1, c.dueDay);
            }
            
            const totalGraceLeft = Math.round((nextDueDate.getTime() - refDate.getTime()) / (1000 * 60 * 60 * 24));
            const safe30 = c.limit * 0.30;
            const buffer = safe30 - c.current;

            return { ...c, totalGraceLeft, buffer, daysToBill };
        })
        .filter(c => c.buffer > 200 && c.daysToBill > 1)
        .sort((a, b) => b.totalGraceLeft - a.totalGraceLeft || b.buffer - a.buffer)
        .slice(0, 4);

    const swipeBox = document.getElementById('swipeFeed');
    if (!bestSwipe.length) {
        swipeBox.innerHTML = '<div style="font-size:0.75rem; color:var(--text-sub); padding:4px 0;">All card cycles normal or 30% quota reached.</div>';
    } else {
        swipeBox.innerHTML = bestSwipe.map(c => `
            <div class="priority-item">
                <div>
                    <div class="p-main">${c.name}</div>
                    <div class="p-sub">Bill: <strong>${c.billDay}th</strong> | Buffer: <strong style="color:var(--success)">₹${Math.round(c.buffer).toLocaleString('en-IN')}</strong></div>
                </div>
                <span class="badge b-success">~${c.totalGraceLeft}d Free</span>
            </div>
        `).join('');
    }

    // 3. Statement Generating Soon
    const genSoon = cards
        .map(c => ({ ...c, days: getDaysUntilTargetDay(c.billDay, refDate), util: c.limit > 0 ? ((c.current/c.limit)*100).toFixed(0) : 0 }))
        .filter(c => c.days <= 4)
        .sort((a, b) => a.days - b.days);

    const genBox = document.getElementById('genFeed');
    if (!genSoon.length) {
        genBox.innerHTML = '<div style="font-size:0.75rem; color:var(--text-sub); padding:4px 0;">No statement generating in the next 4 days.</div>';
    } else {
        genBox.innerHTML = genSoon.map(c => `
            <div class="priority-item">
                <div>
                    <div class="p-main">${c.name}</div>
                    <div class="p-sub">Bill Date: <strong>${c.billDay}th</strong> | Spend: ₹${c.current.toLocaleString('en-IN')}</div>
                </div>
                <span class="badge ${c.util > 30 ? 'b-danger' : 'b-warning'}">${c.days === 0 ? 'Generating Today' : (c.days === 1 ? '1d (Tomorrow)' : c.days + 'd to bill')}</span>
            </div>
        `).join('');
    }
}

function renderCardsFeed(refDate) {
    const feed = document.getElementById('cardsGrid');
    feed.innerHTML = '';

    let totalLimit = 0, totalSafe = 0, totalSpend = 0;

    let list = cards.map(c => {
        const util = c.limit > 0 ? (c.current / c.limit) * 100 : 0;
        const dueDays = getDaysUntilTargetDay(c.dueDay, refDate);
        const billDays = getDaysUntilTargetDay(c.billDay, refDate);
        return { ...c, util, dueDays, billDays };
    });

    if (activeFilter === 'rupay') list = list.filter(c => c.type.toLowerCase().includes('rupay') || c.category === 'rupay');
    if (activeFilter === 'over30') list = list.filter(c => c.util > 30);
    if (activeFilter === 'due') list.sort((a, b) => a.dueDays - b.dueDays);
    if (activeFilter === 'bill') list.sort((a, b) => a.billDays - b.billDays);

    list.forEach(c => {
        totalLimit += c.limit;
        const safe30 = Math.round(c.limit * 0.30);
        totalSafe += safe30;
        totalSpend += c.current;

        let uBadge = "b-success";
        let uFill = "var(--success)";
        if (c.util > 30 && c.util <= 60) { uBadge = "b-warning"; uFill = "var(--warning)"; }
        else if (c.util > 60) { uBadge = "b-danger"; uFill = "var(--danger)"; }

        const isRuPay = c.type.toLowerCase().includes('rupay') || c.category === 'rupay';

        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.innerHTML = `
            <div class="card-tile-top">
                <div>
                    <div class="card-name">${c.name}</div>
                    <div class="card-meta">${c.bank} • ${c.acc}</div>
                </div>
                <div style="display:flex; align-items:center; gap:5px;">
                    <span class="badge ${isRuPay ? 'b-rupay' : 'b-success'}">${c.type}</span>
                    <button class="tool-btn" onclick="openEditModal(${c.id})">✏️</button>
                    <button class="tool-btn" style="color:var(--danger);" onclick="deleteCard(${c.id})">🗑️</button>
                </div>
            </div>

            <div class="card-stats-grid">
                <div class="stat-col">
                    <span>Limit / Safe 30%</span>
                    <strong>₹${c.limit.toLocaleString('en-IN')} <span style="color:var(--success)">/ ₹${safe30.toLocaleString('en-IN')}</span></strong>
                </div>
                <div class="stat-col">
                    <span>Statement / Due</span>
                    <strong>${c.billDay}th <span style="color:${c.dueDays <= 5 && c.current > 0 ? 'var(--danger)' : 'var(--primary)'}">/ ${c.dueDay}th</span></strong>
                </div>
            </div>

            <div class="card-spend-row">
                <div class="spend-input-wrap">
                    <label>Spend:</label>
                    <input type="number" value="${c.current}" onchange="updateSpend(${c.id}, this.value)">
                </div>
                <span class="badge ${uBadge}">${c.util.toFixed(1)}% Used</span>
            </div>

            <div class="meter-bar">
                <div class="meter-fill" style="width: ${Math.min(c.util, 100)}%; background: ${uFill};"></div>
            </div>
        `;
        feed.appendChild(tile);
    });

    document.getElementById('sumLimit').innerText = '₹' + totalLimit.toLocaleString('en-IN');
    document.getElementById('sumSafe').innerText = '₹' + totalSafe.toLocaleString('en-IN');
    document.getElementById('sumSpend').innerText = '₹' + totalSpend.toLocaleString('en-IN');

    const totalUtil = totalLimit > 0 ? ((totalSpend / totalLimit) * 100).toFixed(1) : 0;
    const uBox = document.getElementById('sumUtil');
    uBox.innerText = totalUtil + '%';
    uBox.style.color = totalUtil > 30 ? 'var(--danger)' : 'var(--success)';
}

function updateSpend(id, val) {
    const card = cards.find(c => c.id === id);
    if (card) {
        card.current = parseFloat(val) || 0;
        localStorage.setItem('sgm_cc_dataset', JSON.stringify(cards));
        renderPriorityBanners(selectedDate);
    }
}

function setFilter(filter, el) {
    activeFilter = filter;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCardsFeed(selectedDate);
}

/* Modal Functions */
function openAddCardModal() {
    document.getElementById('modalHeader').innerText = 'Add New Card';
    document.getElementById('fieldCardId').value = '';
    document.getElementById('fieldName').value = '';
    document.getElementById('fieldBank').value = '';
    document.getElementById('fieldAcc').value = '';
    document.getElementById('fieldType').value = 'RuPay UPI';
    document.getElementById('fieldCategory').value = 'rupay';
    document.getElementById('fieldLimit').value = '';
    document.getElementById('fieldBill').value = '';
    document.getElementById('fieldDue').value = '';
    document.getElementById('cardModal').style.display = 'flex';
}

function openEditModal(id) {
    const card = cards.find(c => c.id === id);
    if (!card) return;

    document.getElementById('modalHeader').innerText = 'Edit Card Details';
    document.getElementById('fieldCardId').value = card.id;
    document.getElementById('fieldName').value = card.name;
    document.getElementById('fieldBank').value = card.bank;
    document.getElementById('fieldAcc').value = card.acc;
    document.getElementById('fieldType').value = card.type;
    document.getElementById('fieldCategory').value = card.category;
    document.getElementById('fieldLimit').value = card.limit;
    document.getElementById('fieldBill').value = card.billDay;
    document.getElementById('fieldDue').value = card.dueDay;
    document.getElementById('cardModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('cardModal').style.display = 'none';
}

function saveModalEntry() {
    const editId = document.getElementById('fieldCardId').value;
    const name = document.getElementById('fieldName').value.trim() || 'Custom Card';
    const bank = document.getElementById('fieldBank').value.trim() || 'Bank';
    const acc = document.getElementById('fieldAcc').value.trim() || '...0000';
    const type = document.getElementById('fieldType').value.trim() || 'Credit Card';
    const category = document.getElementById('fieldCategory').value;
    const limit = parseFloat(document.getElementById('fieldLimit').value) || 0;
    const billDay = parseInt(document.getElementById('fieldBill').value) || 1;
    const dueDay = parseInt(document.getElementById('fieldDue').value) || 20;

    if (editId) {
        const card = cards.find(c => c.id == editId);
        if (card) {
            card.name = name;
            card.bank = bank;
            card.acc = acc;
            card.type = type;
            card.category = category;
            card.limit = limit;
            card.billDay = billDay;
            card.dueDay = dueDay;
        }
    } else {
        cards.push({
            id: Date.now(),
            name, bank, acc, type, category,
            limit, current: 0,
            billDay, dueDay
        });
    }

    closeModal();
    saveAndPushCloud();
}

function deleteCard(id) {
    if (confirm("Delete this card?")) {
        cards = cards.filter(c => c.id !== id);
        saveAndPushCloud();
    }
}

/**
 * 2. GITHUB AES-256 SYNC ENGINE
 */
function updateStatus(state, msg) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    dot.className = 'dot ' + state;
    txt.innerText = msg;
}

function toBase64Utf8(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
}

function fromBase64Utf8(str) {
    return decodeURIComponent(Array.prototype.map.call(atob(str.replace(/\s/g, '')), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

async function saveAndPushCloud() {
    localStorage.setItem('sgm_cc_dataset', JSON.stringify(cards));
    renderAll();
    updateStatus('busy', 'Encrypting & Saving...');

    try {
        const rawJson = JSON.stringify(cards);
        const cipherText = CryptoJS.AES.encrypt(rawJson, INTERNAL_AES_PASSPHRASE).toString();

        const fileDoc = JSON.stringify({
            updated_at: new Date().toISOString(),
            payload: cipherText
        }, null, 2);

        const token = getAuthHeader();
        const url = `https://api.github.com/repos/${GITHUB_REPO.owner}/${GITHUB_REPO.repo}/contents/${GITHUB_REPO.file}`;

        if (!fileSha) {
            const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            if (getRes.ok) {
                const getData = await getRes.json();
                fileSha = getData.sha;
            }
        }

        const body = {
            message: `Auto-Sync Encrypted CC Data: ${new Date().toLocaleString()}`,
            content: toBase64Utf8(fileDoc),
            sha: fileSha || undefined
        };

        const res = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            const resData = await res.json();
            fileSha = resData.content.sha;
            updateStatus('synced', 'Cloud Saved Successfully');
            alert('✅ Cloud Saved Successfully!');
        } else {
            throw new Error('API Sync Failed: ' + res.status);
        }
    } catch (e) {
        console.error(e);
        updateStatus('error', 'Sync Failed');
        alert('❌ Sync Fail ho gaya. Connection ya Token check karein.');
    }
}

async function fetchCloudData(silent = false) {
    if (!silent) updateStatus('busy', 'Fetching Cloud...');

    try {
        const token = getAuthHeader();
        const url = `https://api.github.com/repos/${GITHUB_REPO.owner}/${GITHUB_REPO.repo}/contents/${GITHUB_REPO.file}`;

        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Could not fetch file');

        const data = await res.json();
        fileSha = data.sha;
        const decoded = fromBase64Utf8(data.content);
        const parsed = JSON.parse(decoded);

        if (parsed.payload) {
            const bytes = CryptoJS.AES.decrypt(parsed.payload, INTERNAL_AES_PASSPHRASE);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            if (decrypted) {
                cards = JSON.parse(decrypted);
                localStorage.setItem('sgm_cc_dataset', JSON.stringify(cards));
                renderAll();
                updateStatus('synced', 'Cloud Synced');
                if (!silent) alert('✅ Cloud Data Successfully Loaded!');
                return;
            }
        }
    } catch (e) {
        console.error(e);
        updateStatus('synced', 'Local Ready');
    }
}
